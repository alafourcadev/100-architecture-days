name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        day: [001, 002]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Test Day ${{ matrix.day }}
      working-directory: day-${{ matrix.day }}-*
      run: |
        if [ -f "pom.xml" ]; then
          mvn clean test
        fi
