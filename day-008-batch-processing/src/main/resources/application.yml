spring:
  application:
    name: day-008-batch-processing
  datasource:
    url: jdbc:h2:mem:day008
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  h2:
    console:
      enabled: true

server:
  port: 8080
