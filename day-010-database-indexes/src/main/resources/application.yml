spring:
  application:
    name: day-010-database-indexes
  datasource:
    url: jdbc:h2:mem:day010;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  h2:
    console:
      enabled: true

server:
  port: 8080
